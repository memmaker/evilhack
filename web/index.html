<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvilHack</title>
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
	#status { padding: 8px 14px; }
	#status.error { color: #f99; }
	#game { display: grid; grid-template-columns: 1fr 22em; grid-template-rows: 7em auto auto; gap: 4px; padding: 4px; }
	.pane { background: #000; border: 1px solid var(--line); overflow: auto; }
	pre { margin: 0; padding: 2px 6px; font: 14px/1.2 "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre; }
	#t-msg { grid-column: 1; } #t-map { grid-column: 1; position: relative; } #t-stat { grid-column: 1; }
	#t-inv { grid-column: 2; grid-row: 1 / 4; }
	.old { color: var(--dim); } .pr { color: #ffff50; }
	.hero { outline: 1px solid #fff; }
	#pop { position: absolute; left: 8px; top: 8px; background: #000; border: 1px solid var(--dim); max-height: calc(100% - 16px); overflow: auto; z-index: 2; }
	#pop .cur { background: #32326e; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="status">Loading EvilHack…</div>
<div id="game" hidden>
	<div class="pane" id="t-msg"><pre id="msg"></pre></div>
	<div class="pane" id="t-map"><pre id="map"></pre><pre id="pop" hidden></pre></div>
	<div class="pane" id="t-stat"><pre id="stat"></pre></div>
	<div class="pane" id="t-inv"><pre id="inv"></pre></div>
</div>
<script src="evilhack.js"></script>
<script src="evilhack-core.js"></script>
</body>
</html>
