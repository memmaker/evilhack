<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvilHack</title>
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
	#status { padding: 8px 14px; }
	#status.error { color: #f99; }
	#game { display: grid; grid-template-columns: 1fr 22em; grid-template-rows: auto 7em minmax(0, 70vh) auto; gap: 4px; padding: 4px; }
	.pane { background: #000; border: 1px solid var(--line); overflow: auto; }
	pre { margin: 0; padding: 2px 6px; font: 14px/1.2 "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre; }
	#t-msg { grid-column: 1; } #t-map { grid-column: 1; position: relative; } #t-stat { grid-column: 1; }
	#t-inv { grid-column: 2; grid-row: 2 / 5; }
	.old { color: var(--dim); } .pr { color: #ffff50; }
	.hero { outline: 1px solid #fff; }
	#pop { position: fixed; left: 8px; top: 8px; width: max-content; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); box-sizing: border-box; background: #000; border: 1px solid var(--dim); padding: 0 1ch; overflow: auto; z-index: 2; cursor: default; }
	#pop .cur { background: #32326e; }
	#bar { grid-column: 1 / 3; display: flex; gap: 6px; align-items: center; }
	#bar button { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 2px 8px; font: inherit; cursor: pointer; }
	#mapcv { display: block; image-rendering: pixelated; }
	.ti { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; background-image: var(--tiles); background-size: var(--tilew) auto; image-rendering: pixelated; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="status">Loading EvilHack…</div>
<div id="game" hidden>
	<div id="bar"><button id="btn-tiles">Tiles: None</button><span id="zoom" hidden><button id="zoom-out">&minus;</button> <button id="zoom-in">+</button></span></div>
	<div class="pane" id="t-msg"><pre id="msg"></pre></div>
	<div class="pane" id="t-map"><pre id="map"></pre><canvas id="mapcv" hidden></canvas><pre id="pop" hidden></pre></div>
	<div class="pane" id="t-stat"><pre id="stat"></pre></div>
	<div class="pane" id="t-inv"><pre id="inv"></pre></div>
</div>
<script src="evilhack.js"></script>
<script src="evilhack-core.js"></script>
</body>
</html>
